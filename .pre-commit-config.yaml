# Pre‑commit configuration placeholder
# This file is automatically detected by the pre‑commit framework.
# Replace with actual hooks once the project's tooling is decided.
# Runs basic repo‑agnostic hygiene hooks (part of the style lock).
# See golden/CHECKLIST.md for the full gate definitions.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

